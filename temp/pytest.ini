[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --cov=labelforge
    --cov-report=term-missing
    --cov-fail-under=35
    -q
markers =
    unit: pure unit test with no external dependencies
    integration: requires file fixtures and/or SQLite
    e2e: requires a connected physical printer; run with --e2e flag
    slow: takes more than 5 seconds; excluded from fast CI run
    macos_only: runs only on macOS (IS_MACOS == True)
    windows_only: runs only on Windows (IS_WINDOWS == True)
